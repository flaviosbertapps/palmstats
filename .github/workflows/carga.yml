name: carga

# Coleta ESPN + Wikidata e carrega no Supabase.
# Diária: atualiza a temporada corrente e mantém o projeto gratuito do
# Supabase ativo (ele pausa após 7 dias sem uso).
on:
  schedule:
    - cron: "17 9 * * *"   # 06:17 em Brasília
  workflow_dispatch:
    inputs:
      de:
        description: "Primeira temporada (vazio = ano corrente)"
        required: false
      ate:
        description: "Última temporada (vazio = ano corrente)"
        required: false

concurrency: carga

jobs:
  carga:
    # Só roda depois de configurado (Settings → Secrets and variables → Actions):
    #   secret   SUPABASE_DB_URL = string de conexão do Supabase (Session pooler)
    #   variable CARGA_ATIVA     = true
    if: vars.CARGA_ATIVA == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r coleta/requirements.txt

      # Testa a conexão antes da coleta: senha errada falha em segundos, não em 20 min.
      - name: Testa conexão com o Supabase
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Secret SUPABASE_DB_URL não configurado"; exit 1; fi
          psql "$DATABASE_URL" -c "select 1" > /dev/null || {
            echo "::error::Não conectou no Supabase. Confira a senha em SUPABASE_DB_URL (sem [YOUR-PASSWORD]; caracteres especiais precisam de codificação URL, ex.: @ vira %40)."
            exit 1; }

      - uses: actions/cache/restore@v4
        with:
          path: dados/brutos
          key: brutos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brutos-

      - name: Coleta ESPN
        run: |
          ANO=$(date -u +%Y)
          python coleta/espn.py --de "${DE:-$ANO}" --ate "${ATE:-$ANO}" --saida dados/brutos
        env:
          DE: ${{ inputs.de }}
          ATE: ${{ inputs.ate }}

      - name: Coleta Wikidata
        run: python coleta/wikidata.py --saida dados/brutos

      # xG da temporada corrente. API não documentada: se falhar, a carga principal segue.
      - name: Coleta FotMob (xG)
        continue-on-error: true
        run: python coleta/fotmob.py --saida dados/brutos

      # Salva os brutos mesmo que migrations ou carga falhem depois.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: dados/brutos
          key: brutos-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0  # fixa: "latest" consulta a API do GitHub e estourou o limite em 26/11

      - name: Migrations
        run: supabase db push --db-url "$DATABASE_URL" --include-all --yes

      - name: Carga
        run: python coleta/normalizar.py dados/brutos

      - name: Carga xG
        continue-on-error: true
        run: python coleta/xg.py dados/brutos
